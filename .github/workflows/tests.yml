name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  unit:
    name: Unit tests (GUT)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot
        run: |
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Importar scripts y recursos
        run: godot --headless --path . --import

      - name: Ejecutar pruebas unitarias
        run: timeout 5m godot --headless --path . -s res://addons/gut/gut_cmdln.gd -- -gdir=res://tests/unit -gexit

  integration:
    name: Integration tests (GUT + renderer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot y renderer virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri
          curl -sSLo godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$GITHUB_WORKSPACE" >> "$GITHUB_PATH"

      - name: Importar scripts y recursos
        run: godot --headless --path . --import

      - name: Ejecutar pruebas de integración con Xvfb
        run: timeout 10m xvfb-run -a -s "-screen 0 1280x1024x24" godot --path . --rendering-driver opengl3 -s res://addons/gut/gut_cmdln.gd -- -gdir=res://tests/integration -gexit
